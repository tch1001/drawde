name: deploy

# Production deploys on push to main; every PR gets its own Pages preview URL.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy of the same branch.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # vite build does NOT typecheck — it has silently bundled a missing
      # import before now. This is the gate that catches it.
      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: app
        run: npx playwright test --config tests/playwright.config.mjs

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: app/tests/.artifacts/
          retention-days: 7

      - name: Build
        working-directory: app
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 1

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Deploy from this repo only — a fork's PR has no access to the secrets
    # and would fail noisily for a contributor who can't fix it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist

      # Asset dir comes from wrangler.toml (pages_build_output_dir), which also
      # anchors ./functions so /api/pdf ships with the deploy. Branch matters:
      # Pages treats the production branch as production and anything else as a
      # preview, so PRs get their own URL without touching the live site.
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy
            --project-name=drawde
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
