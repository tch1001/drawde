name: deploy

# Production deploys on push to main; every PR gets its own Pages preview URL.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy of the same branch.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # vite build does NOT typecheck — it has silently bundled a missing
      # import before now. This is the gate that catches it.
      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: app
        run: npx playwright test --config tests/playwright.config.mjs

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: app/tests/.artifacts/
          retention-days: 7

      - name: Build
        working-directory: app
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 1

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Deploy from this repo only — a fork's PR has no access to the secrets
    # and would fail noisily for a contributor who can't fix it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist

      # `pages deploy` fails with "Project not found" against an account that
      # has never had this project, so create it on demand instead of making a
      # fresh clone depend on someone having run wrangler by hand. Creating a
      # project that exists returns an error we deliberately swallow — the only
      # outcome that matters is that it exists before the deploy runs.
      - name: Ensure Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$api/drawde" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          if [ "$code" = "200" ]; then
            echo "Pages project 'drawde' already exists."
            exit 0
          fi
          echo "Pages project 'drawde' not found (HTTP $code) — creating it."
          body=$(curl -s "$api" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"drawde","production_branch":"main"}')
          # Trust the follow-up GET, not the POST body: a concurrent run may
          # have won the race, which reports as a failure but is a fine outcome.
          echo "$body" | head -c 400
          code=$(curl -s -o /dev/null -w '%{http_code}' "$api/drawde" \
            -H "Authorization: Bearer $CF_API_TOKEN")
          [ "$code" = "200" ] || { echo "::error::Could not create Pages project (HTTP $code)"; exit 1; }

      # Asset dir comes from wrangler.toml (pages_build_output_dir), which also
      # anchors ./functions so /api/pdf ships with the deploy. Branch matters:
      # Pages treats the production branch as production and anything else as a
      # preview, so PRs get their own URL without touching the live site.
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy
            --project-name=drawde
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
